name: keepalive
# Keeps the free Render instance awake so the demo never shows the cold-start page.
# GitHub schedules are best-effort; 10 minutes is well inside Render's 15-minute idle timeout.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://hemma-support-agent.onrender.com/healthz) && [ "$code" = "200" ] && { echo "ok $code"; exit 0; }
            echo "attempt $i: $code"; sleep 20
          done
          exit 1
